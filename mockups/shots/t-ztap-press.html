<!doctype html>
<html><body style="margin:0;background:#EDF1F7;padding:30px">
<iframe id="f" src="../z-beat-tap.html" style="display:block;width:280px;height:400px;border:0;margin:0 auto"></iframe>
<div id="log" style="font:14px monospace;padding:10px"></div>
<script>
  var f = document.getElementById("f"), log = document.getElementById("log");
  f.addEventListener("load", function () {
    setTimeout(function () {
      try {
        var d = f.contentDocument;
        d.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
        log.textContent = "pointerdown dispatched";
      } catch (e) { log.textContent = "ERR: " + e.message; }
    }, 600);
  });
</script>
</body></html>
