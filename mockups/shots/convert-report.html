<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cash Value Report</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal-theme.css">
<style>
  /* Cash Value Report, classic-blue theme (from the funnel thank-you page design).
     Populated from the contact's real data via /report/api/<id>/<token>. Shows the selling-range
     slider as the single value view. */
  /* Tokens come from the shared /portal-theme.css (linked above). */
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
       background:var(--soft);-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  img{display:block}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

  header{background:#fff;border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
  .brand-logo{font-weight:900;font-size:20px;letter-spacing:-.02em;color:var(--c1)}
  .powered{font-size:12px;color:var(--muted)}
  .powered b{color:var(--c1);font-weight:700}

  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;
        box-shadow:0 14px 34px -22px rgba(14,27,51,.18)}
  main{padding:22px 0 40px}
  main>.wrap{display:flex;flex-direction:column;gap:16px}
  main>.wrap>*{min-width:0}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--c1);font-weight:800;
           font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);
                box-shadow:0 0 0 4px rgba(59,164,244,.22)}

  .mast{display:flex;align-items:center;gap:18px;justify-content:space-between}
  .mast h1{font-size:27px;font-weight:800;letter-spacing:-.025em;margin-top:6px}
  .mast .addr{font-size:15px;font-weight:600;color:var(--ink);margin-top:8px}
  .mast .facts{font-size:13px;color:var(--muted);margin-top:4px}
  .mast .facts b{color:var(--ink);font-weight:700}
  .mast .photo{flex:none;position:relative;overflow:hidden;width:300px;height:170px;border-radius:14px;
               background:linear-gradient(135deg,var(--tint),#cfe0fb);display:flex;align-items:center;justify-content:center}
  .mast .photo svg{width:64px;height:64px;color:var(--c1);opacity:.55}
  .mast .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  .xslot .eyebrow{color:var(--muted)}
  .xcard{display:flex;align-items:center;gap:16px}
  /* Shared lead (2+ pros): a comfortable row (2–3) or an auto-rotating carousel (4–6). Each card
     has its own orange Contact button that opens a per-agent Call/Text modal. */
  .xhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .xhead .xcount{font-size:12.5px;color:var(--muted)}
  .xtrack{display:flex;gap:12px}
  .xshared.xstatic .xtrack{flex-wrap:wrap}
  .xshared.xcar .xtrack{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
                        margin:0 -4px;padding:0 4px;cursor:grab}
  .xshared.xcar .xtrack::-webkit-scrollbar{display:none}
  .xshared.xcar .xtrack.dragging{cursor:grabbing}
  .xpro{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px;
        display:flex;flex-direction:column;gap:14px;min-width:0}
  .xshared.xstatic .xpro{flex:1 1 220px}
  .xshared.xcar .xpro{flex:0 0 100%}
  .xpro-top{display:flex;align-items:center;gap:14px;min-width:0}
  .xpro-hs{flex:none;width:48px;height:48px;border-radius:50%;object-fit:cover}
  .xpro .avatar{width:48px;height:48px;font-size:16px}
  .xpro .xname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xcontact-card{width:100%;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;
                 font-weight:800;font-size:14.5px;padding:11px 16px;border:none;border-radius:11px;
                 cursor:pointer;background:var(--cta);color:#fff}
  .xcontact-card:hover{background:var(--cta-d)}
  .xnav{display:flex;justify-content:center;margin-top:16px}
  .xdots{display:flex;gap:7px}
  .xdot{width:8px;height:8px;border-radius:50%;border:none;background:var(--line);cursor:pointer;padding:0}
  .xdot.on{background:var(--c1)}
  @media (min-width:761px){.xshared.xcar .xpro{flex-basis:calc((100% - 24px)/3)}}
  @media (max-width:560px){.xshared.xstatic .xpro{flex-basis:100%}}

  /* Per-agent Call/Text modal (opened from a card's Contact button) */
  .amodal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
  .amodal[hidden]{display:none}
  .amodal-back{position:fixed;inset:0;background:rgba(8,14,26,.55)}
  .amodal-card{position:relative;width:100%;max-width:360px;background:#fff;border-radius:18px;
               padding:26px 22px 22px;box-shadow:0 40px 90px -20px rgba(0,0,0,.5);text-align:left}
  .amodal-x{position:absolute;top:9px;right:12px;border:none;background:none;font-size:25px;line-height:1;
            color:var(--muted);cursor:pointer;padding:4px}
  .amodal-x:hover{color:var(--ink)}
  /* Identity block: rounded headshot, then name / brokerage / email / website — each on its own line. */
  .amodal-id{display:flex;flex-direction:column;gap:11px;margin-bottom:20px}
  .amodal-hs{width:66px;height:66px;border-radius:50%;object-fit:cover;background:var(--tint);flex:none}
  .amodal-hs.avatar{display:flex;align-items:center;justify-content:center;color:var(--c1);font-weight:800;font-size:22px}
  .amodal-lines{display:flex;flex-direction:column;gap:3px;min-width:0}
  .amodal-name{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .amodal-broker{font-size:13.5px;color:var(--muted);font-weight:600}
  .amodal-line{font-size:13.5px;color:var(--c1);text-decoration:none;font-weight:600;word-break:break-word}
  .amodal-line:hover{text-decoration:underline}
  .amodal-btns{display:flex;gap:10px}
  /* Call = primary orange; Text = the secondary "Schedule a call" look. nowrap keeps the revealed
     number "(417) 805-2240" on one line. */
  .amodal-btns .btn{flex:1;white-space:nowrap;padding:12px 12px;font-size:14.5px}
  .amodal-btns .amodal-cta{background:var(--cta);color:#fff;border:none}
  .amodal-btns .amodal-cta:hover{background:var(--cta-d)}
  .amodal-btns .amodal-alt{background:#fff;color:var(--c1);border:1.5px solid var(--line)}
  .amodal-btns .amodal-alt:hover{border-color:var(--c1)}
  .avatar{flex:none;width:58px;height:58px;border-radius:50%;background:var(--tint);color:var(--c1);
          display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;letter-spacing:.02em}
  /* Single "Your local expert" tile: a larger headshot/avatar circle than the shared-lead cards. */
  .xsolo-hs{flex:none;width:74px;height:74px;border-radius:50%;object-fit:cover}
  .avatar.xsolo-av{width:74px;height:74px;font-size:24px}
  .xwho{min-width:0;flex:1}
  .xname{font-size:17.5px;font-weight:800;letter-spacing:-.01em}
  .xbrok{font-size:13px;color:var(--muted);margin-top:2px}
  .xline{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:12px}
  .xbtns{display:flex;gap:10px;margin-top:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;
       font-weight:800;font-size:15px;padding:13px 18px;border-radius:12px;cursor:pointer;border:none}
  .btn-cta{background:var(--cta);color:#fff;flex:1}
  .btn-cta:hover{background:var(--cta-d)}
  .btn-line{background:#fff;color:var(--c1);border:1.5px solid var(--line);flex:1}
  .btn-line:hover{border-color:var(--c1)}

  .vmod[hidden]{display:none}
  .vhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  /* "Preparing your cash offers" hint: shown on the selling-range card while Zoodealio's real cash
     offers are still generating (uses the guide's tint + sky accent, with the eyebrow-dot glow). */
  .cash-pending{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;background:var(--tint);border-radius:999px;font-size:12px;font-weight:700;color:var(--c1);white-space:nowrap}
  .cash-pending .cp-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:cpPulse 1.5s ease-out infinite}
  @keyframes cpPulse{0%{box-shadow:0 0 0 0 rgba(59,164,244,.5)}70%{box-shadow:0 0 0 7px rgba(59,164,244,0)}100%{box-shadow:0 0 0 0 rgba(59,164,244,0)}}
  .vnote{font-size:12.5px;font-style:italic;color:var(--muted);line-height:1.5;margin-top:14px;text-align:center}
  /* "Talk through your range with [name]" CTA: styled as the filled orange button used for the
     "Your local expert" Call/Text buttons (.btn-cta), not a plain text link. */
  .vask{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:15px;
        font-weight:800;color:#fff;background:var(--cta);padding:13px 22px;border-radius:12px;
        width:fit-content;max-width:100%;margin:14px auto 0}
  .vask:hover{background:var(--cta-d)}

  .vrange{font-size:38px;font-weight:800;letter-spacing:-.03em;margin-top:10px;text-align:center}
  /* Split label: the snapped offer's name, its own centered line under the number — quieter and a
     touch smaller, a soft navy (not grey), readable on mobile. */
  .vsub{font-size:15.5px;font-weight:600;letter-spacing:-.01em;text-align:center;color:#51648F;margin-top:4px;min-height:20px}
  .vsub .vinfo{margin-left:8px}
  /* (i) beside the snapped offer in the headline — per-offer copy set in Settings → Report Page
     Slider. Tap/click toggles it (works on touch); desktop also opens it on hover. */
  .vinfo{position:relative;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:10px;cursor:pointer;outline:none}
  .vinfo-i{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--c1);border:1.5px solid rgba(29,79,215,.3);
           font-size:15px;font-weight:800;font-style:normal;letter-spacing:0;display:flex;align-items:center;justify-content:center;line-height:1}
  .vinfo:hover .vinfo-i,.vinfo:focus-visible .vinfo-i,.vinfo.open .vinfo-i{background:var(--c1);color:#fff;border-color:var(--c1)}
  .vinfo-pop{display:none;position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);width:270px;max-width:76vw;
             background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
             font-size:13.5px;font-weight:500;line-height:1.5;letter-spacing:0;text-align:left;white-space:normal;
             box-shadow:0 26px 54px -18px rgba(0,0,0,.45);z-index:60}
  /* --arrow-shift counters any viewport clamping of the bubble so the arrow still points at the (i). */
  .vinfo-pop::before{content:"";position:absolute;top:-7px;left:calc(50% + var(--arrow-shift, 0px));transform:translateX(-50%) rotate(45deg);width:12px;height:12px;
                     background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:3px 0 0 0}
  .vinfo.open .vinfo-pop{display:block}
  @media (hover:hover){ .vinfo:hover .vinfo-pop{display:block} }
  /* Value-curve track (ported from Lucas's zbValueSlider): an area chart of the offer values, blue
     gradient fill riding the handle, grey beyond. Geometry mirrors the component exactly. */
  .vslide{position:relative;height:96px;margin:14px 2px 2px;cursor:pointer;touch-action:none}
  .vs-curve{position:absolute;left:0;right:0;bottom:8px;width:100%;height:57px;display:block}
  .vs-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#8296B9;border:2px solid #fff;box-shadow:0 1px 3px rgba(14,27,51,.3);transform:translate(-50%,-50%);z-index:2;pointer-events:none}
  .vs-handle{position:absolute;top:59%;width:26px;height:74px;border-radius:13px;background:var(--cta);border:3px solid #fff;box-shadow:0 4px 14px rgba(14,27,51,.45);transform:translate(-50%,-50%);cursor:grab;z-index:3}
  .vs-handle::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:22px;transform:translate(-50%,-50%);border-left:2px solid rgba(255,255,255,.8);border-right:2px solid rgba(255,255,255,.8)}
  .vs-handle.snap{transition:left .18s ease}
  .vs-handle:focus-visible{outline:none;box-shadow:0 0 0 5px rgba(29,79,215,.28),0 3px 10px rgba(14,27,51,.4)}
  .vs-ends{display:flex;justify-content:space-between;gap:14px;margin-top:10px}
  .vs-end b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
  .vs-end span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .vs-end.right{text-align:right}

  .vcards{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .vcard{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 14px;background:#fff}
  .vcard.feat{border-color:var(--c1);background:var(--tint)}
  .vchip{position:absolute;top:-9px;left:14px;font-size:10px;font-weight:800;letter-spacing:.07em;
         text-transform:uppercase;color:#fff;background:var(--c1);border-radius:999px;padding:3px 9px}
  .vkick{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--c1)}
  .vnum{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
  .vmeta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .vmeta b{color:var(--ink);font-weight:700}
  .vdesc{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:7px}

  .spec{margin-top:20px}
  .srow{position:relative;height:44px}
  .sbar{position:absolute;top:22px;height:12px;border-radius:999px}
  .slab{position:absolute;top:0;font-size:12px;color:var(--muted);white-space:nowrap}
  .slab b{color:var(--ink);font-weight:800}
  .saxis{position:relative;height:4px;border-radius:999px;margin-top:8px;
         background:linear-gradient(90deg,var(--acc),var(--c1) 55%,var(--navy))}
  .vpoles{display:flex;justify-content:space-between;gap:14px;margin-top:12px}
  .vpole b{display:block;font-size:13.5px;font-weight:800;color:var(--ink)}
  .vpole span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .vpole.right{text-align:right}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  h2.sec{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .pd-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .pd-src{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .facts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .fact{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}
  .fact span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .fact b{display:block;font-size:15.5px;font-weight:800;margin-top:4px}
  .hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.45}
  .hint a{color:var(--c1);font-weight:700}

  .equity p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:8px}
  .equity .btn{width:100%;margin-top:16px}

  .htoggle{display:flex;gap:8px}
  .htoggle button{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:#fff;
                  border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
  .htoggle button.on{background:var(--tint);border-color:var(--c1);color:var(--c1)}
  .chart{margin-top:16px}
  .chart svg{width:100%;height:auto;display:block}
  .chart .gl{stroke:var(--line);stroke-width:1}
  .chart .yl,.chart .xl{font-size:11px;fill:var(--muted);font-family:'Inter',sans-serif}

  footer{padding:26px 20px 34px;text-align:center;font-size:13px;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:underline}
  .load{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}

  /* "Preparing your report" gate: the design guide's Z-beat (looping demo variant) shown while the
     Zoodealio pull settles, then fades to reveal the report. SVG + keyframes verbatim from the guide. */
  .zbeat{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--soft);opacity:1;transition:opacity .35s ease}
  .zbeat[hidden]{display:none}
  .zbeat.done{opacity:0}
  .zbeat .zb-note{font-size:17px;font-weight:700;color:var(--ink);text-align:center;padding:0 24px}
  .zb-sphere{width:150px;height:150px;border:0;background:transparent;display:block;pointer-events:none}
  .zb-dots::after{content:'.';animation:zbDots 1.4s steps(1,end) infinite}
  @keyframes zbDots{0%{content:'.'}33%{content:'..'}66%,100%{content:'...'}}
  .zb-pair{transform-origin:100px 100px;transform:rotate(395deg)}
  .zb-w{transform:translate(99px,-180px)}
  .zb-b{transform:translate(-99px,180px)}
  .zbeat .zb-pair{animation:zbSpin 1.6s linear infinite alternate both}
  .zbeat .zb-w{animation:zbWalkW 1.6s linear infinite alternate both}
  .zbeat .zb-b{animation:zbWalkB 1.6s linear infinite alternate both}
  @keyframes zbSpin{0%{transform:rotate(395deg)}25%{transform:rotate(395deg);animation-timing-function:cubic-bezier(.42,.05,.35,1)}92%,100%{transform:rotate(0deg)}}
  @keyframes zbWalkW{0%{transform:translate(99px,-180px);animation-timing-function:cubic-bezier(.2,.6,.3,1)}40%,100%{transform:translate(0,0)}}
  @keyframes zbWalkB{0%{transform:translate(-99px,180px);animation-timing-function:cubic-bezier(.2,.6,.3,1)}40%,100%{transform:translate(0,0)}}
  @media (prefers-reduced-motion:reduce){.zb-pair,.zb-w,.zb-b{transform:none!important;animation:none!important}}
  /* Orange progress bar under the spinner: fills across the (configurable) wait window so a longer
     hold keeps visibly moving. Grows in steps on the Z-spin cadence, snaps to 100% on reveal. */
  .zb-prog{width:190px;max-width:62vw;height:8px;background:rgba(14,27,51,.10);border-radius:999px;overflow:hidden}
  .zb-prog b{display:block;height:100%;width:0;background:var(--cta);border-radius:999px;transition:width .5s cubic-bezier(.25,.8,.3,1)}
  @media (prefers-reduced-motion:reduce){.zb-prog b{transition:none}}
  /* Estimate disclaimer: shown in the value card when the range is an estimate (no real Zoodealio offers). */
  .vdisc{margin:12px auto 0;max-width:440px;font-size:12.5px;line-height:1.5;color:var(--muted);text-align:center}
  /* Per-section loader (selling range + property details): the mini Z-beat spinner + the orange
     progress bar, shown in-card while that section waits for its data. */
  .sec-load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 12px 20px}
  .zmini{width:56px;height:56px}
  .zmini .zb-pair{animation:zbSpin 1.6s linear infinite alternate both}
  .zmini .zb-w{animation:zbWalkW 1.6s linear infinite alternate both}
  .zmini .zb-b{animation:zbWalkB 1.6s linear infinite alternate both}
  /* Stagger the two section spinners so they don't beat in lockstep: the property-details spinner runs
     a touch slower and starts mid-cycle. Same offset on all three pieces keeps its logo coherent. */
  #detailsCard .zmini .zb-pair,#detailsCard .zmini .zb-w,#detailsCard .zmini .zb-b{animation-duration:2.15s;animation-delay:-.95s}
  .sec-load-t{font-size:13.5px;color:var(--muted);font-weight:600}

  @media (min-width:761px){
    .xcard-x{display:flex;align-items:flex-start;gap:18px}
    .xcard-x .xbtns{margin-top:18px;flex:none;width:340px}
    .xcard-x .xline{margin-top:0}
  }

  @media (max-width:760px){
    .wrap{padding:0 14px}
    main{padding:14px 0 28px}
    main>.wrap{gap:12px}
    .card{padding:16px;border-radius:16px}
    .mast{gap:12px}
    .mast h1{font-size:21.5px;margin-top:5px}
    .mast .addr{font-size:14px;margin-top:6px}
    .mast .facts{font-size:12px}
    .mast .photo{width:86px;height:86px;border-radius:12px}
    .mast .photo svg{width:40px;height:40px}
    .vrange{font-size:29px}
    .vnum{font-size:20px}
    .grid2{grid-template-columns:1fr}
    .facts-grid{grid-template-columns:repeat(2,1fr)}
    .slab{font-size:11px}
  }

  /* modals (refine value + schedule a call) */
  .mm-overlay{position:fixed;inset:0;background:rgba(14,27,51,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
  .mm-overlay[hidden]{display:none}
  .mm-card{position:relative;background:#fff;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
  .mm-x{position:absolute;top:12px;right:16px;border:none;background:none;font-size:24px;color:#9aa7bd;cursor:pointer}
  .mm-title{font-size:19px;font-weight:800;letter-spacing:-.02em}

  .sched-msg{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:90px;outline:none}

.rtp-gallery .sec{margin-bottom:4px}

<body>

<div class="zbeat" id="prep">
  <!-- Initial load only: the self-contained Z-sphere widget (bare = transparent, no chrome). The
       per-section loaders (selling range, property details) keep the flat Z-beat mini spinner. -->
  <iframe class="zb-sphere" src="/z-beat-tap.html?bare=1&pal=primary" title="Loading" scrolling="no" aria-hidden="true"></iframe>
  <p class="zb-note">Preparing your cash value report</p>
</div>

<header><div class="wrap hbar"></div></header>

<main><div class="wrap" id="content">
  <div class="load" id="loading">Loading your report…</div>
</div></main>

<footer>&copy; <span id="yr"></span> zBuyer</footer>

<div class="mm-overlay" id="refineModal" hidden>
  <div class="mm-card">
    <button class="mm-x" type="button" onclick="closeRefine()" aria-label="Close">&times;</button>
    <div class="mm-prog"><b id="rProg" style="width:20%"></b></div>
    <div class="mm-title" id="rTitle"></div>
    <div class="mm-sub" id="rSub"></div>
    <div id="rBody"></div>
    <div class="mm-foot" id="rFoot"></div>
  </div>
</div>

<div class="mm-overlay" id="schedModal" hidden>
  <div class="mm-card">
    <button class="mm-x" type="button" onclick="closeSchedule()" aria-label="Close">&times;</button>
    <div class="mm-title" id="schedTitle">Schedule a call</div>
    <div id="schedPick">
      <div id="cal"></div>
      <div class="times" id="schedTimes" hidden><div class="tl">Pick a time</div><div class="times-grid" id="timeGrid"></div></div>
    </div>
    <div id="schedCompose" hidden>
      <div class="sched-when" id="schedWhen" onclick="schedReopen()"></div>
      <textarea class="sched-msg" id="schedMsg" placeholder="Add a note (optional)"></textarea>
      <button class="btn btn-cta" id="schedSubmit" type="button" style="width:100%;margin-top:12px" onclick="submitSchedule()">Send request</button>
      <div class="mm-confirm" id="schedConfirm" hidden></div>
    </div>
  </div>
</div>

<div class="pmodal" id="phoneModal" hidden>
  <div class="pm-backdrop" data-pmclose></div>
  <div class="pm-card">
    <button type="button" class="pm-x" data-pmclose aria-label="Close">&times;</button>
    <div class="pm-step" id="pmStepPhone">
      <h3>Update your mobile number</h3>
      <p class="pm-sub">We'll text a code to your new number to confirm it.</p>
      <input id="pmPhone" type="tel" inputmode="tel" placeholder="(555) 555-5555" autocomplete="tel">
      <button type="button" class="btn btn-cta" id="pmSend">Send code</button>
      <div class="pm-err" id="pmErr"></div>
    </div>
    <div class="pm-step" id="pmStepCode" hidden>
      <h3>Enter the code</h3>
      <p class="pm-sub">We sent a 6-digit code to <b id="pmSentTo"></b>.</p>
      <input id="pmCode" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
      <button type="button" class="btn btn-cta" id="pmVerify">Verify &amp; update</button>
      <div class="pm-err" id="pmErr2"></div>
    </div>
  </div>
</div>

<div class="pmodal" id="emailModal" hidden>
  <div class="pm-backdrop" data-emclose></div>
  <div class="pm-card">
    <button type="button" class="pm-x" data-emclose aria-label="Close">&times;</button>
    <h3>Update your email address</h3>
    <input id="emInput" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email">
    <button type="button" class="btn btn-cta" id="emSave">Save</button>
    <div class="pm-err" id="emErr"></div>
  </div>
</div>

<script>
(function () {
  var HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>';
  document.getElementById('yr').textContent = new Date().getFullYear();

  function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }
  // Centered green success flash that fades out on its own.
  function flashCenter(msg){
    var el = document.createElement('div');
    el.textContent = msg;
    el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3000;background:#14a35a;color:#fff;font-weight:700;font-size:15px;padding:16px 26px;border-radius:12px;box-shadow:0 12px 40px rgba(20,24,40,.28);opacity:0;transition:opacity .18s ease;';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.style.opacity='1'; });
    setTimeout(function(){ el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 260); }, 1400);
  }
  var parts = window.location.pathname.replace(/^\/report\//,'').split('/');
  var id = parts[0], token = parts[1];
  var apiBase = '/report/api/' + encodeURIComponent(id) + '/' + encodeURIComponent(token);
  var _sliderMoved = false;  // one-shot: only the FIRST value-slider move is tracked
  var _soloAgentName = '';   // exclusive-lead single agent, for Call/Text tap tracking
  // Analytics mode (admin Reports tab): served at /admin/analytics/report. An exact, read-only render
  // fed a demo model, with a click-aggregate overlay drawn on top. No real contact, so no tracking.
  var _analytics = /^\/admin\/analytics\/report(?:\/|$)/.test(window.location.pathname);
  // Admin silent-preview: "Log in to reports portal (as admin)" opens this page with ?admin=1. In
  // that mode every activity beacon is suppressed, so an admin previewing the report never pollutes
  // the contact's timeline and never fires activity automations off their own clicks.
  var _adminPreview = /[?&]admin=1(?:&|$)/.test(window.location.search);
  // Agent view: served at /report/agent/<token>. The homeowner's REAL report, branded exclusively to
  // one agent, immune to branding removal. Read-only + fires no automations (like the admin preview),
  // but no admin banner. The path-parse above already yields apiBase = /report/api/agent/<token>.
  var _agentView = /^\/report\/agent\//.test(window.location.pathname);

  // Report activity tracker → /report/api/<id>/<token>/track (fire-and-forget; keepalive lets it
  // survive tel:/sms: navigation). Lands in the contact's timeline tagged [Reports Portal].
  function track(event, label, detail){
    if (_adminPreview || _analytics || _agentView) return;   // silent admin preview / analytics / agent view: log nothing, trigger nothing
    try {
      fetch(apiBase + '/track', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ event: event, label: label, detail: (detail == null ? '' : String(detail)) }), keepalive: true }).catch(function(){});
    } catch(e){}
  }
  window.track = track;  // inline onclick handlers (e.g. the banner dismiss) run in global scope
  // Banner × : record the dismiss, then remove the notice (analytics render swallows the click).
  window.dismissBanner = function(btn){ track('banner_dismiss', 'Dismissed the report banner'); var n = btn.closest('.notice'); if (n) n.remove(); };

  // Admin silent-preview: block every submit (schedule / refine / phone / email) so an admin
  // previewing the report can't change the homeowner's data or fire an automation by an accidental
  // click. Returns true (and flashes a note) when in preview so callers early-return.
  function previewBlock(){
    if (!_adminPreview && !_agentView) return false;
    var el = document.createElement('div');
    el.textContent = 'Admin preview, actions are disabled.';
    el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:#14233D;color:#fff;font:700 14px Inter,system-ui,sans-serif;padding:14px 24px;border-radius:12px;box-shadow:0 12px 40px rgba(20,24,40,.3)';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1400);
    return true;
  }
  // On load in preview mode, show a persistent banner and disable the static submit buttons.
  if (_adminPreview) {
    document.addEventListener('DOMContentLoaded', function(){
      var b = document.createElement('div');
      b.textContent = '👁 Admin preview, actions are disabled.';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#0E1B33;color:#fff;font:600 13px/1.4 Inter,system-ui,sans-serif;text-align:center;padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25)';
      document.body.appendChild(b);
      ['schedSubmit','pmSend','pmVerify','emSave'].forEach(function(id){ var el = document.getElementById(id); if (el) { el.disabled = true; el.style.opacity = '.5'; el.style.cursor = 'not-allowed'; } });
    });
  }

  // "Preparing your report" screen: a fixed 3s hold (Zoodealio is usually back by then). Whatever
  // has landed shows; if the cash offers aren't in yet, the report renders on ATTOM/public data and
  // shows a "Preparing your cash offers" hint, then swaps the real offers in when they arrive.
  function loadReport(){
    fetch(_analytics ? '/admin/analytics/report-data' : apiBase)
      .then(function(r){ if(!r.ok) throw new Error('nf'); return r.json(); })
      .then(function(m){
        render(m); hidePrep();
        if (_analytics) { initAnalyticsOverlay(m); return; }   // demo render + overlay; no watcher, no beacon
        if (_agentView) return;                                // agent view: real report, read-only, no watcher/track/automations
        watchSections(m); track('report_view', 'Opened their Cash Value Report');
      })
      .catch(function(){ hidePrep(); document.getElementById('loading').textContent = 'This report link is invalid or has expired.'; });
  }

  // Reports-analytics overlay: wrap the rendered report in the .ra-canvas/.ra-report frame, make it
  // read-only, load the overlay engine, and poll the aggregate so the numbers grow live.
  function fetchAggregate(){ return fetch('/admin/analytics/report-aggregate' + (location.search || '')).then(function(r){ return r.json(); }).catch(function(){ return {}; }); }
  // Base annotations + one dot per offer type. A dot is muted (grey) when its type is disabled in the
  // live slider config, so the circles mirror exactly what the report is showing vs. hiding.
  function analyticsAnnos(m){
    // Combo: circle+arrow stays for the slider, refine, value history and the report-views baseline;
    // Call/Text/Schedule and each selling-range dot become inline "N clicks · P%" stats instead of
    // circles (the old combined "Contact agent" circle is gone — its buttons are inline now).
    var annos = [
      { key: 'report_view',  side: 'left',  attach: 'left',   label: 'Report views' },
      { key: 'slider_move',  side: 'left',  attach: 'bottom', label: 'Slider moved' },
      { key: 'refine',       side: 'right', attach: 'right',  label: 'Refine value' },
      { key: 'value_history',side: 'right', attach: 'right',  label: 'Value history' },
      { key: 'call',     type: 'inline', place: 'under' },
      { key: 'text',     type: 'inline', place: 'under' },
      { key: 'schedule', type: 'inline', place: 'under' },
      { key: 'talk_range', type: 'inline', place: 'under' }
    ];
    (m.analyticsDots || []).forEach(function(d){ annos.push({ key: d.ra, type: 'inline', place: 'under' }); });
    return annos;
  }
  function initAnalyticsOverlay(m){
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '/analytics-overlay.css'; document.head.appendChild(css);
    var content = document.getElementById('content');
    var mainEl = content.closest('main');
    var canvas = document.createElement('div'); canvas.className = 'ra-canvas';
    var report = document.createElement('div'); report.className = 'ra-report';
    if (mainEl && mainEl.parentNode) mainEl.parentNode.insertBefore(canvas, mainEl);
    else document.body.appendChild(canvas);
    canvas.appendChild(report); report.appendChild(content);
    content.style.maxWidth = 'none'; content.style.padding = '0'; content.style.width = '100%';
    if (mainEl) mainEl.style.display = 'none';
    // Read-only: swallow clicks on the report's real links/buttons. The overlay circles live in the
    // canvas margins (outside .ra-report), so they still receive their own events.
    report.addEventListener('click', function(e){ var t = e.target.closest('a,button'); if (t && !t.closest('.rtp-gallery')) { e.preventDefault(); e.stopPropagation(); } }, true);
    var js = document.createElement('script'); js.src = '/analytics-overlay.js';
    js.onload = function(){
      fetchAggregate().then(function(stats){
        window._raOverlay = ReportAnalyticsOverlay.init({ canvas: canvas, color: '#1D4FD7', stats: stats, annos: analyticsAnnos(m) });
        setInterval(function(){ fetchAggregate().then(function(fresh){ if (window._raOverlay) window._raOverlay.setStats(fresh); }); }, 12000);
      });

  }
  function hidePrep(){
    var el = document.getElementById('prep');

    el.classList.add('done');

  // Whether we have real Zoodealio cash offers (not the estimated fallback).
  function hasRealOffers(m){ return !!(m && m.has_offers && !m.offers_estimated); }
  // Whether property facts have landed (REAPI/ATTOM/OpenAI).
  function hasDetails(m){ var r = (m && m.report) || {}; return !!(r.beds || r.baths || r.sqft || r.year_built); }
  // Real public-record details (ATTOM/REAPI) reveal instantly. OpenAI-derived details respect the
  // spinner window (details_source === 'openai'), so a homeowner never sees an AI estimate pop in instantly.
  function hasRealDetails(m){ var r = (m && m.report) || {}; return hasDetails(m) && r.details_source !== 'openai'; }

  // A section's orange progress bar: ease-out toward ~92% across its wait window, stepping on the
  // ~1.6s cadence so a longer wait keeps visibly moving. Snaps to 100% when the section finalizes.
  function startCardProgress(barId, ms){
    var start = Date.now();
    (function step(){
      var bar = document.getElementById(barId); if (!bar) return;   // gone once the card finalizes
      var t = Math.min(1, (Date.now() - start) / ms);
      bar.style.width = Math.round((1 - Math.pow(1 - t, 2)) * 92) + '%';
      if (t < 1) setTimeout(step, 1600);
    })();
  }
  // Rebuild the selling-range card from fresh data (real offers, or the estimated fallback + disclaimer).
  function finalizeValue(m2){
    var card = document.getElementById('valueCard'); if (!card) return;
    var tmp = document.createElement('div'); tmp.innerHTML = valueModuleHtml(m2);
    card.parentNode.replaceChild(tmp.firstChild, card);
    wireSlider(m2.range || {});
  }
  // Rebuild the property-details card from fresh data.
  function finalizeDetails(m2){
    var card = document.getElementById('detailsCard'); if (!card) return;
    var tmp = document.createElement('div'); tmp.innerHTML = detailsCardHtml(m2);
    card.parentNode.replaceChild(tmp.firstChild, card);
  }

  // Per-section loaders. After the fast initial reveal, the selling range and property details each
  // spin (with the orange bar) until their data lands or their wait window expires — so the homeowner
  // sees whatever we already have immediately and only waits on what's actually pending:
  //  • Selling range: real Zoodealio offers, or the estimated (fallbackPct% of value) range afterward.
  //    We keep watching past the window so late Zoodealio still swaps the real offers in.
  //  • Property details: public data (REAPI/ATTOM/OpenAI), or whatever we have once the window passes.
  function watchSections(m){
    var vNeed = !_analytics && !_agentView && !hasRealOffers(m);   // selling range waiting on real Zoodealio (agent view never waits)
    var dNeed = !_analytics && !_agentView && !hasRealDetails(m);  // details wait unless we already have REAL public records (OpenAI respects the spinner)
    var vWait = Math.max(0, Number(_cfg.range_wait_seconds) || 0) * 1000;
    var dWait = Math.max(0, Number(_cfg.details_wait_seconds) || 0) * 1000;
    if (vNeed) startCardProgress('valBar', vWait || 1);
    if (dNeed) startCardProgress('detBar', dWait || 1);
    if (!vNeed && !dNeed) return;
    var start = Date.now(), vShown = false, dShown = false, CAP = 90000;
    (function tick(){
      fetch(apiBase).then(function(r){ return r.ok ? r.json() : null; }).then(function(m2){
        var elapsed = Date.now() - start;
        if (m2) {
          if (vNeed) {
            if (hasRealOffers(m2)) { finalizeValue(m2); vNeed = false; }         // real offers → done
            else if (!vShown && elapsed >= vWait) { finalizeValue(m2); vShown = true; }  // reveal estimate; keep watching for real
          }
          if (dNeed) {
            if (hasRealDetails(m2)) { finalizeDetails(m2); dNeed = false; }        // real public records landed → reveal now
            else if (!dShown && elapsed >= dWait) { finalizeDetails(m2); dShown = true; }  // window passed → reveal OpenAI/placeholder, keep watching for late real records
          }
        }
        if ((vNeed || dNeed) && elapsed < CAP) setTimeout(tick, 2500);
      }).catch(function(){ if (Date.now() - start < CAP) setTimeout(tick, 2500); });
    })();
  }
  // Mini Z-beat spinner (the same logo animation as the initial screen) for the section loading cards.
  // Unique gradient/clip ids so it never collides with the initial spinner's defs.

      + '<defs><radialGradient id="zbStageM" cx="50%" cy="44%" r="68%"><stop offset="0%" stop-color="#172A4E"/><stop offset="100%" stop-color="#0E1B33"/></radialGradient>'
      + '<clipPath id="zbClipM"><circle cx="100" cy="100" r="96"/></clipPath></defs>'
      + '<circle cx="100" cy="100" r="96" fill="url(#zbStageM)"/>'
      + '<g clip-path="url(#zbClipM)"><g class="zb-pair">'

      + '<g class="zb-piece zb-b"><polygon fill="#3BA4F4" points="160,158 72,158 136,42 161,42 105,132 160,132"/></g>'
      + '</g></g></svg></div>';

  // Selling-range loading card (Z spinner + message + orange bar), shown while real Zoodealio is pending.
  function valueLoadingHtml(){
    return '<section class="card vmod" id="valueCard"><div class="vhead"><span class="eyebrow">Your selling range</span></div>'
      + '<div class="sec-load">' + zSpinnerHtml() + '<p class="sec-load-t">'+esc(_cfg.range_loading_text || 'Preparing your cash offers')+'</p>'
      + '<div class="zb-prog"><b id="valBar"></b></div></div></section>';

  // Property-details loading card (Z spinner + message + orange bar), shown while public data is pending.
  function detailsLoadingHtml(){
    return '<section class="card" id="detailsCard"><div class="pd-head"><h2 class="sec">Property details</h2></div>'
      + '<div class="sec-load">' + zSpinnerHtml() + '<p class="sec-load-t">'+esc(_cfg.details_loading_text || 'Pulling your property records')+'</p>'
      + '<div class="zb-prog"><b id="detBar"></b></div></div></section>';
  }

  // Loading config (section wait windows, verbiage, failsafe) — from Settings → Report Page Loading,
  // delivered on the first status poll (the report page is public and can't read /api/settings). The
  // initial spinner is a fixed short hold so the homeowner lands fast; the per-section spinners (below)
  // handle the real waits (Zoodealio for the selling range, public data for property details).
  var _cfg = { range_wait_seconds: 12, details_wait_seconds: 8, loading_text: '', range_loading_text: 'Preparing your cash offers', details_loading_text: 'Pulling your property records', disclaimer: '' };
  var INITIAL_HOLD_MS = 3000;
  function beginLoading(){
    if (_cfg.loading_text) {
      var note = document.querySelector('#prep .zb-note');
      if (note) { var dots = note.querySelector('.zb-dots'); note.textContent = _cfg.loading_text; if (dots) note.appendChild(dots); }
    }
    setTimeout(loadReport, (_analytics || _agentView) ? 0 : INITIAL_HOLD_MS);
  }
  // Fetch the config up front (this poll also kicks the OpenAI failsafe server-side), then reveal after
  // the fixed initial hold. Runs regardless of success so the report always reveals.
  if (_analytics) { beginLoading(); }
  else {
    fetch(apiBase + '/status')
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(s){ if (s && s.config) _cfg = s.config; })
      .catch(function(){})
      .then(beginLoading);
  }

  // Presence heartbeat: ping every ~5s while the tab is visible so the server knows the homeowner is
  // still here. When they leave/hide the tab the pings stop and report_last_seen_at goes stale —
  // which is what the delayed "your offers are live" text keys off. Off in admin preview / analytics.
  if (!_adminPreview && !_analytics && !_agentView) {
    var heartbeat = function(){ if (document.visibilityState === 'visible') { try { fetch(apiBase + '/heartbeat', { method:'POST', keepalive:true }).catch(function(){}); } catch(e){} } };
    heartbeat();
    setInterval(heartbeat, 5000);
  }

  function fact(label, val){ return val ? '<div class="fact"><span>'+esc(label)+'</span><b>'+esc(val)+'</b></div>' : ''; }

  // Property-details card (id="detailsCard" so watchSections can rebuild it when public data lands).
  function detailsCardHtml(m){
    var rep = (m && m.report) || {}, ag = m && m.agent;
    var agFirst = (ag && (ag.first || ag.name)) ? esc(ag.first || ag.name) : '';
    var agHref = (ag && ag.phone) ? 'href="tel:'+esc(ag.phone)+'"' : 'href="#" onclick="openSchedule();return false;"';
    var facts = fact('Beds', rep.beds) + fact('Baths', rep.baths)
      + fact('Square feet', rep.sqft ? Number(rep.sqft).toLocaleString('en-US') : '')
      + fact('Year built', rep.year_built) + fact('Type', rep.type) + fact('Occupancy', rep.occupancy)
      + fact('Heating', rep.heating) + fact('Exterior', rep.exterior);
    var detailsSrc = rep.details_source === 'openai' ? 'Source: OpenAI' : (rep.details_source === 'attom' ? 'Source: ATTOM' : '');
    var body = facts
      ? '<div class="facts-grid">'+facts+'</div>'
        + (agFirst ? '<p class="hint">Something look off? <a data-ra="expert_correct" '+agHref+' onclick="track(\'details_correct\', \'Asked the expert to correct details\')">Your expert can correct it</a>, better facts mean better numbers.</p>' : '')
      : '<p class="hint" style="margin-top:8px">Property records aren\'t available for this home yet.</p>';
    return '<section class="card" id="detailsCard"><div class="pd-head"><h2 class="sec">Property details</h2>'+(detailsSrc?'<span class="pd-src">'+detailsSrc+'</span>':'')+'</div>'+body+'</section>';
  }

  // Selling-range card. Standalone so the background offer-watcher can rebuild just this card once
  // Zoodealio's real cash offers land. Shows a "Preparing your cash offers" hint until they do.
  function valueModuleHtml(m){
    var range = m.range || {}, ag = m.agent;
    // No value ready yet (no REAPI/ATTOM/Zoodealio value and the OpenAI failsafe hasn't landed):
    // show a plain placeholder, not a fake range. The background watcher rebuilds this card once a
    // value appears.
    if (!range.display) {
      return '<section class="card vmod" id="valueCard"><div class="vhead"><span class="eyebrow">Your selling range</span></div>'
        + '<p class="vrange" style="font-size:16px;line-height:1.55;color:#334155;font-weight:600">We are preparing your report. Please refresh in a few seconds.</p></section>';
    }
    var agFirst = (ag && (ag.first || ag.name)) ? esc(ag.first || ag.name) : '';
    var agHref = (ag && ag.phone) ? 'href="tel:'+esc(ag.phone)+'"' : 'href="#" onclick="openSchedule();return false;"';
    // Shared lead (2+ pros): drop the single-agent "Talk through your range with [name]" link.
    var multiAg = ((m.agents) || []).length >= 2;
    // data-ra on an inner inline span (not the full-width, text-centered <a>), so the overlay arrow
    // lands on the actual text instead of the link box's empty left edge.
    // "Talk through your range" CTA: dial the agent (or open schedule if no phone) AND fire a distinct
    // 'talk_range' event so the analytics overlay can show a clicks/CTR stat for it. track() is a no-op
    // in analytics-render mode, so the overlay is unaffected.
    var vaskAttrs = (ag && ag.phone)
      ? 'href="tel:'+esc(ag.phone)+'" onclick="track(\'talk_range\',\'Tapped Talk through your range\')"'
      : 'href="#" onclick="track(\'talk_range\',\'Tapped Talk through your range\');openSchedule();return false;"';
    var vask = (agFirst && !multiAg) ? '<a class="vask" '+vaskAttrs+'><span data-rs="talk_range">Talk through your range with '+agFirst+' &rarr;</span></a>' : '';
    // Zoodealio is pulled for every contact now (enrichContactForPortal), including ones whose value
    // came from the OpenAI failsafe, so the hint tracks the offers alone. The watcher drops it if
    // Zoodealio finishes with nothing.
    var pending = m.has_offers ? '' : '<span class="cash-pending" id="cashPending"><span class="cp-dot"></span>Preparing your cash offers&hellip;</span>';
    var ends = '<div class="vs-ends"><div class="vs-end"><b>'+esc(range.lowLabel||'')+'</b><span>'+esc(range.lowName||'')+'</span></div>'
      + '<div class="vs-end right"><b>'+esc(range.highLabel||'')+'</b><span>'+esc(range.highName||'')+'</span></div></div>';
    // Analytics: one cosmetic dot per offer type (all of them, tagged for the overlay). Live report:
    // the real middle-anchor dots.
    // Analytics: cosmetic dots tagged data-rs so each gets an inline "N clicks · P%" stat. Live report:
    // real middle dots, tappable so a homeowner tapping one logs offer_dot (detail=stop key) — that's
    // what the per-dot stat counts. (In analytics mode track() is a no-op and clicks are swallowed.)
    // ── Value-curve track (ported from Lucas's zbValueSlider) ──────────────────────────────────
    // The track is an area chart of the offer values: x by value (the backend percents are already
    // value-proportional), height by value (span-zoomed over an 8px floor). Blue gradient fills to
    // the handle (deepest blue rides it), grey beyond. Geometry mirrors the component exactly.
    var VS_CH = 57, VS_HMIN = 8, VS_SLIDE = 96, VS_BOTTOM = 8;
    var A = range.anchors || [];
    var vmn = A.length ? A[0].raw : 0, vmx = A.length ? A[A.length - 1].raw : 0;
    var vsSingle = A.length <= 1 || vmx === vmn;
    function vsAyRaw(raw){ var f = (vmx > vmn) ? (raw - vmn) / (vmx - vmn) : 1; return VS_CH - (VS_HMIN + f * (VS_CH - VS_HMIN)); }
    function vsDotTop(ay){ return (VS_SLIDE - VS_BOTTOM - VS_CH + ay); }
    // ay at an arbitrary percent (analytics dots carry no raw value): linear interp between anchors
    function vsAyAtP(p){
      if (!A.length) return VS_CH; if (A.length === 1 || vsSingle) return vsAyRaw(A.length ? A[0].raw : 0);
      for (var i = 0; i < A.length - 1; i++){ if (p <= A[i + 1].p || i === A.length - 2){ var a = A[i], b = A[i + 1]; var t = (b.p > a.p) ? (p - a.p) / (b.p - a.p) : 0; t = Math.max(0, Math.min(1, t)); return vsAyRaw(a.raw) + (vsAyRaw(b.raw) - vsAyRaw(a.raw)) * t; } }
      return vsAyRaw(A[A.length - 1].raw);
    }
    var vsD;
    if (vsSingle) { vsD = 'M0 ' + VS_CH + ' L0 0 L1000 0 L1000 ' + VS_CH + ' Z'; }
    else {
      var vpts = A.map(function(a){ return [a.p * 10, vsAyRaw(a.raw)]; });
      vsD = 'M0 ' + VS_CH + ' L0 ' + vpts[0][1] + ' L' + vpts[0][0] + ' ' + vpts[0][1];
      for (var vs = 0; vs < vpts.length - 1; vs++){ var vdx = (vpts[vs + 1][0] - vpts[vs][0]) / 2.2; vsD += ' C' + (vpts[vs][0] + vdx) + ' ' + vpts[vs][1] + ' ' + (vpts[vs + 1][0] - vdx) + ' ' + vpts[vs + 1][1] + ' ' + vpts[vs + 1][0] + ' ' + vpts[vs + 1][1]; }
      vsD += ' L1000 ' + vpts[vpts.length - 1][1] + ' L1000 ' + VS_CH + ' Z';
    }
    var vsW0 = vsSingle ? 1000 : 500;   // handle starts centered (50% => 500 of 1000)
    var curveSvg = '<svg class="vs-curve" viewBox="0 0 1000 ' + VS_CH + '" preserveAspectRatio="none" aria-hidden="true">'
      + '<defs><linearGradient id="vsGrad" x1="0" y1="0" x2="' + vsW0 + '" y2="0" gradientUnits="userSpaceOnUse">'
      + '<stop offset="0" stop-color="#7FC4FF"></stop><stop offset="1" stop-color="#1D4FD7"></stop></linearGradient>'
      + '<clipPath id="vsClip"><rect id="vsClipRect" x="0" y="0" width="' + vsW0 + '" height="' + VS_CH + '"></rect></clipPath></defs>'
      + '<path d="' + vsD + '" fill="#E4EAF3"></path>'
      + '<path d="' + vsD + '" fill="url(#vsGrad)" clip-path="url(#vsClip)"></path></svg>';
    // Dots ON the curve. Analytics: cosmetic, data-rs (overlay attaches per-dot stats). Live: real
    // middle dots, tappable (logs offer_dot). Vertical position tracks each anchor's curve height.
    var dots = (m.analyticsDots)
      ? m.analyticsDots.map(function(d){ return '<span class="vs-dot" data-rs="'+esc(d.ra)+'" style="left:'+d.p+'%;top:'+vsDotTop(vsAyAtP(d.p))+'px" title="'+esc(d.label)+'"></span>'; }).join('')
      : (vsSingle ? [] : A).map(function(a){ return '<span class="vs-dot" style="left:'+a.p+'%;top:'+vsDotTop(vsAyRaw(a.raw))+'px" title="'+esc(a.n+', '+a.v)+'"></span>'; }).join('');
    // Estimate disclaimer: shown when the range is an estimate — i.e. the numbers are ATTOM- or
    // OpenAI-derived, not real Zoodealio offers (offers_estimated, since has_offers is also true for
    // the synthesized failsafe offers). Copy is admin-configured; dropped once real offers arrive.
    var disc = (m.offers_estimated && range.display && _cfg.disclaimer) ? '<p class="vdisc">'+esc(_cfg.disclaimer)+'</p>' : '';
    return '<section class="card vmod" id="valueCard"><div class="vhead"><span class="eyebrow">Your selling range</span>'+pending+'</div>'
      + '<p class="vrange" id="vRange">'+esc(range.display||'')+'</p>'
      + '<p class="vsub" id="vSub"></p>'
      + disc
      + '<div class="vslide" id="vSlide">'+curveSvg+dots+'</div>'
      + ends
      + '<p class="vnote">This range reflects different ways to sell, it is not an appraisal of your home. Where you land depends on the path you choose.</p>'
      + vask + '</section>';
  }

  // ── Add-on report tiles (Lucas's REAPI cards) ──────────────────────────────────────────────────
  // Each tile reuses the report's .card container; tileHtml builds the inner content per key. Returns

        + '<div class="rt-statline"><span>Mortgage payoff</span><b>'+esc(d.mortgage)+'</b></div>');

      var rows = d.rows.map(function(c){ return '<tr><td>'+esc(c.addr)+' · '+esc(c.dist)+'</td><td>'+esc(c.sold)+'</td><td class="hl">'+esc(c.price)+'</td><td>'+esc(c.ppsf)+'</td></tr>'; }).join('');

      var hist = (d.history||[]).map(function(h){ var tag = h.you?' <span style="color:#8a97ab">(you)</span>':(h.est?' <span style="color:#8a97ab">(estimate)</span>':''); return '<tr><td>'+esc(h.date)+tag+'</td><td class="hl">'+esc(h.price)+'</td><td>'+esc(h.change)+'</td></tr>'; }).join('');
      return tileCard(key, 'Appreciation & price history',
        '<p class="rt-sub">How this home\'s value has moved, and every recorded sale.</p>'

        + '<div class="rt-statline"><span>Estimated value today</span><b>'+esc(d.estValue)+'</b></div>'
        + '<div class="rt-statline"><span>Total change ('+esc(d.years)+')</span><b>'+esc(d.totalChangePct)+'</b></div>'
        + '<div class="rt-statline"><span>Annualized</span><b>'+esc(d.annualizedPct)+'</b></div>'
        + '<table class="rt-table" style="margin-top:14px"><tbody><tr><th>Date</th><th class="hl">Price</th><th>Change</th></tr>'+hist+'</tbody></table>');
    }
    if (key === 'velocity') return tileCard(key, 'Equity velocity',
      '<p class="rt-sub">Equity accumulated per year of ownership.</p>'
      + '<div class="rt-bignum" style="font-size:32px">'+esc(d.perYear)+'</div>'

  // Teaser/CTA shown when a tile is enabled but has no data yet (manual force-on, or the global "if

  // Render enabled tiles in config order, using the server's per-tile resolved decision

    var keys = Object.keys(cfg).filter(function(k){ return decide(k).render; })
      .sort(function(a,b){ return ((cfg[a]||{}).order||0) - ((cfg[b]||{}).order||0); });
    if (opts.only) keys = keys.filter(function(k){ return opts.only.indexOf(k) >= 0; });
    if (opts.skip) keys = keys.filter(function(k){ return opts.skip.indexOf(k) < 0; });
    return keys.map(function(k){

        var top = (visTop + visBot) / 2 - mh / 2;                 // center in the visible slice
        top = Math.min(top, visBot - mh - 8, docH - mh - 8);      // never below the visible slice / doc
        top = Math.max(top, visTop + 8, 8);                       // never above it
        modal.style.marginTop = Math.round(top) + 'px';
      } catch (e) {}
    }, 0);

      b.addEventListener('click', function(){
        ov.querySelectorAll('.rtp-vbtn').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); paint(b.getAttribute('data-v'));

  // Shared-lead pros carousel (4–6): auto-rotates one card every ~4.5s (eased ~1.1s glide), pauses
  // on drag and resumes 30s after. Advances by ONE card so every card is reachable (2–3 = static row).
  var _shareAgents = [];
  function wireAgents(){
    var sec = document.getElementById('xShared');
    if (!sec || !sec.classList.contains('xcar')) return;   // static row: nothing to animate
    var track = document.getElementById('xTrack');
    if (!track) return;
    var dotsWrap = document.getElementById('xDots'), dots = [];
    function step(){ var c = track.querySelector('.xpro'); return c ? c.getBoundingClientRect().width + 12 : track.clientWidth; }
    function visible(){ return Math.max(1, Math.round(track.clientWidth / step())); }
    function positions(){ return Math.max(1, track.children.length - visible() + 1); }
    function index(){ return Math.max(0, Math.min(positions()-1, Math.round(track.scrollLeft / step()))); }
    function sync(){ var p = index(); dots.forEach(function(d,i){ d.classList.toggle('on', i===p); }); }
    function glideTo(to){
      var startL = track.scrollLeft, delta = to - startL, t0 = null, dur = 1100;
      function ease(p){ return p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2; }
      function frame(ts){ if (t0===null) t0=ts; var p = Math.min(1, (ts-t0)/dur);
        track.scrollLeft = startL + delta*ease(p);
        if (p < 1) requestAnimationFrame(frame); }
      requestAnimationFrame(frame);
    }
    function buildDots(){
      if (!dotsWrap) return;
      dotsWrap.innerHTML = ''; dots = [];
      for (var i=0;i<positions();i++){
        var d = document.createElement('button'); d.className='xdot'; d.setAttribute('aria-label','Position '+(i+1));
        (function(n){ d.addEventListener('click', function(){ nudge(); glideTo(n*step()); }); })(i);
        dotsWrap.appendChild(d); dots.push(d);
      }
      sync();
    }
    var raf=0; track.addEventListener('scroll', function(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(sync); });
    window.addEventListener('resize', buildDots);

    var timer=null, resume=null;
    function tick(){ var next = index()+1; if (next > positions()-1) next = 0; glideTo(next*step()); }
    function startAuto(){ stopAuto(); timer=setInterval(tick, 2000); }
    function stopAuto(){ if (timer){ clearInterval(timer); timer=null; } }
    function nudge(){ stopAuto(); if (resume) clearTimeout(resume); resume=setTimeout(startAuto, 30000); }   // resume 30s after last interaction
    track.addEventListener('wheel', nudge, {passive:true});
    track.addEventListener('touchstart', nudge, {passive:true});

    // mouse drag-to-scroll (touch uses native overflow scrolling)
    var down=false, startX=0, startL=0;
    track.addEventListener('pointerdown', function(e){
      // touch → native scroll; a press on a Contact button → let the click through (don't drag/preventDefault)
      if (e.pointerType !== 'mouse' || e.target.closest('.xcontact-card')) { nudge(); return; }
      down=true; startX=e.clientX; startL=track.scrollLeft; track.classList.add('dragging');
      try { track.setPointerCapture(e.pointerId); } catch(err){} nudge(); e.preventDefault();
    });
    track.addEventListener('pointermove', function(e){ if (down) track.scrollLeft = startL - (e.clientX - startX); });
    function up(){ if (!down) return; down=false; track.classList.remove('dragging'); }
    track.addEventListener('pointerup', up);
    track.addEventListener('pointercancel', up);

    buildDots();
    startAuto();
  }

  function moneyK(n){ return '$' + Math.round(n/1000) + 'K'; }

  function wireChart(vh){
    var nowY = new Date().getFullYear();
    function build(series){
      var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
      if (max === min) max = min + 1;
      var n = series.length;
      var pts = series.map(function(v,i){
        var x = 40 + (540*(i/(n-1)));
        var y = 200 - ((v-min)/(max-min))*180;
        return [Math.round(x), Math.round(y*10)/10];
      });
      var line = 'M' + pts.map(function(p){return p[0]+','+p[1];}).join(' L');
      return { line: line, min: min, max: max, mid: (min+max)/2, n: n };
    }
    var b5 = document.getElementById('h5'), b10 = document.getElementById('h10');
    var hLine = document.getElementById('hLine'), hArea = document.getElementById('hArea');
    function draw(which){
      var series = which==='y10' ? vh.y10 : vh.y5;
      if (!series) series = vh.y5;
      var d = build(series);
      hLine.setAttribute('d', d.line);
      hArea.setAttribute('d', d.line + ' L580,200 L40,200 Z');
      document.getElementById('y0').textContent = moneyK(d.min);
      document.getElementById('y1').textContent = moneyK(d.mid);
      document.getElementById('y2').textContent = moneyK(d.max);
      var span = which==='y10' ? 10 : 5, step = which==='y10' ? 2 : 1;
      var g = document.getElementById('xLabs'); g.innerHTML='';
      for (var yr = nowY-span, i=0; yr<=nowY; yr+=step, i++){
        var x = 40 + (540*((yr-(nowY-span))/span));
        var anchor = yr===nowY-span ? 'start' : (yr===nowY ? 'end' : 'middle');
        g.innerHTML += '<text class="xl" x="'+Math.round(x)+'" y="222" text-anchor="'+anchor+'">'+yr+'</text>';
      }
      b5.classList.toggle('on', which!=='y10'); b10.classList.toggle('on', which==='y10');
    }
    b5.addEventListener('click', function(){ track('chart_toggle', 'Viewed 5-year value history'); draw('y5'); });
    b10.addEventListener('click', function(){ if (vh.y10){ track('chart_toggle', 'Viewed 10-year value history'); draw('y10'); } });
    draw('y5');
  }

  var _vinfoWired = false;
  function wireVinfoDismiss(){

  function wireSlider(range){
    var slide = document.getElementById('vSlide'); if (!slide) return;
    var rangeEl = document.getElementById('vRange'), subEl = document.getElementById('vSub');
    var clipRect = document.getElementById('vsClipRect'), grad = document.getElementById('vsGrad');
    // Blue gradient fill rides the handle: clip the filled curve to the handle x, grey beyond.
    function paintCurve(p){ var w = Math.max(40, p*10); if(clipRect) clipRect.setAttribute('width', w); if(grad) grad.setAttribute('x2', w); }
    var full = range.display || '';
    var ANCHORS = (range.anchors || []).slice();
    if (!ANCHORS.length) return;
    var handle = document.createElement('span');
    handle.className = 'vs-handle'; handle.tabIndex = 0; handle.setAttribute('role','slider');
    handle.setAttribute('data-ra', 'slider_move');   // analytics overlay target (inert on the live report)
    handle.style.left = '50%'; slide.appendChild(handle);
    paintCurve(50);
    var idx = -1;

    wireVinfoDismiss();
    // The bubble is centered on the (i), so near a screen edge it would run off-viewport. Nudge it
    // back in and counter-shift the arrow so it still points at the icon.
    function placeVinfo(t){
      var pop = t.querySelector('.vinfo-pop'); if (!pop) return;
      pop.style.transform = 'translateX(-50%)'; pop.style.setProperty('--arrow-shift', '0px');
      var r = pop.getBoundingClientRect(), pad = 12, shift = 0;
      if (r.right > window.innerWidth - pad) shift = (window.innerWidth - pad) - r.right;
      else if (r.left < pad) shift = pad - r.left;
      if (shift) {
        pop.style.transform = 'translateX(-50%) translateX(' + shift + 'px)';
        pop.style.setProperty('--arrow-shift', (-shift) + 'px');
      }
    }
    // Toggle the (i) on click/tap or Enter/Space (delegated — the headline is re-rendered per snap).
    function toggleVinfo(e){
      var t = e.target && e.target.closest ? e.target.closest('.vinfo') : null;
      if (!t) return;
      e.stopPropagation(); e.preventDefault();
      var wasOpen = t.classList.contains('open');
      var o = document.querySelector('.vinfo.open'); if (o) o.classList.remove('open');
      if (!wasOpen) { t.classList.add('open'); placeVinfo(t); track('info_open', 'Opened the value info'); }
    }
    // The (i) now lives in the sub-label (under the number), so wire it there.
    subEl.addEventListener('click', toggleVinfo);
    subEl.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') toggleVinfo(e); });
    // Desktop hover opens it via CSS; clamp it there too (mouseenter doesn't bubble, so use mouseover).
    subEl.addEventListener('mouseover', function(e){
      var t = e.target && e.target.closest ? e.target.closest('.vinfo') : null;
      if (t) placeVinfo(t);
    });

    function snapTo(i){
      idx = Math.max(0, Math.min(ANCHORS.length-1, i));
      var a = ANCHORS[idx];
      handle.classList.add('snap'); handle.style.left = a.p + '%';
      // Per-offer "Information box" copy (Settings). Blank → no (i) at all.
      var info = a.info
        ? ' <span class="vinfo" data-ra="info_i" tabindex="0" role="button" aria-label="More about this option">'
          + '<span class="vinfo-i" aria-hidden="true">i</span>'
          + '<span class="vinfo-pop">' + esc(a.info) + '</span></span>'
        : '';
      paintCurve(a.p);
      rangeEl.innerHTML = esc(a.v);            // value on its own line
      subEl.innerHTML = esc(a.n) + info;        // label beneath, quieter, with the optional (i)
      // Track which offer the homeowner moved the slider to: feeds the per-dot overlay stat AND can
      // trigger an "On Homeowner Activity" automation (event=offer_dot, source=report, detail=key).
      // No-op in analytics/preview (track() returns early there).
      var k = (a.ra || '').replace('dot_', '');
      if (k) track('offer_dot', 'Moved the slider to ' + a.n, k);
    }
    function pctFromX(x){ var r = slide.getBoundingClientRect(); return Math.max(5, Math.min(95, ((x-r.left)/r.width)*100)); }
    var dragging = false;
    slide.addEventListener('pointerdown', function(e){ dragging=true; handle.classList.remove('snap'); try{slide.setPointerCapture(e.pointerId);}catch(err){} var p=pctFromX(e.clientX); handle.style.left = p+'%'; paintCurve(p); e.preventDefault(); });
    // First value-slider move only (module-level flag survives the background card rebuild).
    function firstMove(){ if(!_sliderMoved){ _sliderMoved=true; track('slider_move', 'Moved the value slider for the first time'); } }
    slide.addEventListener('pointermove', function(e){ if(dragging){ firstMove(); var p=pctFromX(e.clientX); handle.style.left = p+'%'; paintCurve(p); } });
    function endDrag(e){ if(!dragging) return; dragging=false; var p=pctFromX(e.clientX); var best=0; ANCHORS.forEach(function(a,i){ if(Math.abs(a.p-p)<Math.abs(ANCHORS[best].p-p)) best=i; }); snapTo(best); }
    slide.addEventListener('pointerup', endDrag); slide.addEventListener('pointercancel', endDrag);
    handle.addEventListener('keydown', function(e){
      if(e.key==='ArrowRight'||e.key==='ArrowUp'){ firstMove(); snapTo(idx<0?0:idx+1); e.preventDefault(); }
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ firstMove(); snapTo(idx<0?0:idx-1); e.preventDefault(); }
    });
    // Analytics render: snap once so the headline (i) is present for its overlay circle, then park the
    // handle at centre (off every dot) so the "Slider moved" arrow points to open track.
    if (_analytics && ANCHORS.length > 1) { snapTo(1); handle.style.left = '50%'; }
  }

    document.getElementById('rProg').style.width = Math.round(((_rStep+1)/total)*100)+'%';
    document.getElementById('rTitle').textContent = s.title;
    document.getElementById('rSub').textContent = s.sub + ' (Step '+(_rStep+1)+' of '+total+')';
    var body = document.getElementById('rBody'), html;
    if (s.kind === 'single') {
      var sel = _rAns[s.key];
      html = '<div class="mm-opts">' + s.opts.map(function(o){ return '<button type="button" class="mm-opt'+(sel===o[0]?' on':'')+'" data-k="'+o[0]+'" onclick="rPick(this)">'+esc(o[1])+'</button>'; }).join('') + '</div>';
    } else {
      var arr = _rAns[s.key];
      html = '<div class="mm-tiles">' + s.tiles.map(function(t){ var on = arr.indexOf(t[0])!==-1; return '<button type="button" class="mm-tile'+(on?' on':'')+'" data-k="'+t[0]+'" onclick="rTile(this)">'+esc(t[1])+'</button>'; }).join('') + '</div>';
    }
    body.innerHTML = html;
    document.getElementById('rBack').disabled = _rStep === 0;
    document.getElementById('rNext').textContent = _rStep === total-1 ? 'Finish' : 'Next';
  }
  window.rPick = function(el){ _rAns[REFINE_STEPS[_rStep].key] = el.getAttribute('data-k'); [].forEach.call(document.getElementById('rBody').querySelectorAll('.mm-opt'), function(b){ b.classList.remove('on'); }); el.classList.add('on'); };
  window.rTile = function(el){ var arr = _rAns[REFINE_STEPS[_rStep].key], k = el.getAttribute('data-k'), i = arr.indexOf(k); if (i===-1){ arr.push(k); el.classList.add('on'); } else { arr.splice(i,1); el.classList.remove('on'); } };
  window.rNav = function(dir){ if (dir<0){ if (_rStep>0){ _rStep--; rStepRender(); } return; } if (_rStep < REFINE_STEPS.length-1){ _rStep++; rStepRender(); return; } rSave(); };
  function rSave(){
    if (previewBlock()) return;
    var btn = document.getElementById('rNext'); btn.disabled = true; btn.textContent = 'Saving…';
    fetch('/report/api/'+encodeURIComponent(id)+'/'+encodeURIComponent(token)+'/refine-value', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(_rAns) })
      .then(function(r){ return r.json(); }).then(function(j){ if (!j || !j.ok) throw new Error(); track('refine', 'Refined their home value'); rDone(); })
      .catch(function(){ btn.disabled = false; btn.textContent = 'Finish'; document.getElementById('rSub').textContent = 'Something went wrong. Please try again.'; });
  }
  function rDone(){
    document.getElementById('rProg').style.width = '100%';
    document.getElementById('rTitle').textContent = '';
    document.getElementById('rSub').textContent = '';
    document.getElementById('rBody').innerHTML = '<div class="mm-done"><div class="rd-check">&#10003;</div><div class="rd-t">Thanks, your value is refined</div><div class="rd-s">We tightened your estimate using what you told us. Your updated range is ready.</div></div>';
    document.getElementById('rFoot').innerHTML = '<button class="btn btn-cta" type="button" onclick="location.reload()">See my updated range</button>';
  }

  // ── Schedule a call modal (same calendar flow as the full portal) ──
  var _calMonth = null, _selDate = null, _selWindow = null;
  window.openSchedule = function(){
    var m = document.getElementById('schedModal'); if (!m) return;
    document.getElementById('schedTitle').textContent = 'Schedule a call' + (_agentName ? ' with ' + _agentName : '');
    _selDate = null; _selWindow = null;
    document.getElementById('schedTimes').hidden = true;
    document.getElementById('schedCompose').hidden = true;
    document.getElementById('schedConfirm').hidden = true;
    document.getElementById('schedPick').style.display = '';
    if (!_calMonth) _calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    renderCal();
    m.hidden = false;
  };
  window.closeSchedule = function(){ document.getElementById('schedModal').hidden = true; };
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function renderCal(){
    var cal = document.getElementById('cal'); if (!cal) return;
    var today = new Date(); today.setHours(0,0,0,0);
    var mo = _calMonth, title = mo.toLocaleString('en-US',{month:'long',year:'numeric'});
    var firstDow = mo.getDay(), days = new Date(mo.getFullYear(),mo.getMonth()+1,0).getDate();
    var prevOff = (mo.getFullYear()===today.getFullYear() && mo.getMonth()===today.getMonth());
    var dows = ['S','M','T','W','T','F','S'];
    var h = '<div class="cal-head"><span class="cal-title">'+title+'</span><span class="cal-nav"><button type="button" '+(prevOff?'disabled':'')+' onclick="calNav(-1)">&lsaquo;</button><button type="button" onclick="calNav(1)">&rsaquo;</button></span></div><div class="cal-grid">';
    h += dows.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
    for (var i=0;i<firstDow;i++) h += '<div></div>';
    for (var day=1; day<=days; day++){ var dd = new Date(mo.getFullYear(),mo.getMonth(),day); var past = dd<today; var sel = _selDate && sameDay(dd,_selDate);
      h += '<button class="cal-day'+(sel?' sel':'')+'" type="button" '+(past?'disabled':'')+' onclick="pickDate('+mo.getFullYear()+','+mo.getMonth()+','+day+')">'+day+'</button>'; }
    cal.innerHTML = h + '</div>';
  }
  window.calNav = function(d){ _calMonth = new Date(_calMonth.getFullYear(), _calMonth.getMonth()+d, 1); renderCal(); };
  window.pickDate = function(y,mo,day){
    _selDate = new Date(y,mo,day); renderCal();
    var windows = [[8,10],[10,12],[12,14],[14,16],[16,18]];
    function lab(hh){ var ap = hh>=12?'pm':'am'; var h12 = hh%12; if (h12===0) h12=12; return h12+ap; }
    document.getElementById('timeGrid').innerHTML = windows.map(function(w){ var l = lab(w[0])+' to '+lab(w[1]); return '<button class="time-slot" type="button" onclick="pickTime(this,\''+l+'\')">'+l+'</button>'; }).join('');
    document.getElementById('schedConfirm').hidden = true;
    document.getElementById('schedTimes').hidden = false;
  };
  window.pickTime = function(el,label){
    [].forEach.call(document.getElementById('timeGrid').querySelectorAll('.time-slot'), function(b){ b.classList.remove('sel'); });
    el.classList.add('sel'); _selWindow = label;
    var d = _selDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    document.getElementById('schedWhen').innerHTML = esc(d+' · '+label) + ' <span style="text-decoration:underline;margin-left:6px">Change</span>';
    document.getElementById('schedPick').style.display = 'none';
    document.getElementById('schedMsg').value = _scheduleMsg || '';
    var btn = document.getElementById('schedSubmit'); btn.disabled = false; btn.textContent = 'Send request';
    document.getElementById('schedCompose').hidden = false;
  };
  window.schedReopen = function(){ document.getElementById('schedPick').style.display = ''; document.getElementById('schedCompose').hidden = true; };
  window.submitSchedule = function(){
    if (previewBlock()) return;
    if (!_selDate || !_selWindow) return;
    var btn = document.getElementById('schedSubmit'); btn.disabled = true; btn.textContent = 'Sending…';
    var dateStr = _selDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    fetch('/report/api/'+encodeURIComponent(id)+'/'+encodeURIComponent(token)+'/schedule', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ date:dateStr, window:_selWindow, message:(document.getElementById('schedMsg').value||'').slice(0,250) }) })
      .then(function(r){ return r.json(); }).then(function(j){ if (!j || !j.ok) throw new Error();
        track('schedule', 'Requested a call: '+dateStr+', '+_selWindow, (document.getElementById('schedMsg').value||'').slice(0,250));
        var c = document.getElementById('schedConfirm'); c.textContent = 'Request sent for '+dateStr+', '+_selWindow+'. Your expert will confirm shortly.'; c.hidden = false; btn.textContent = 'Request sent';
      }).catch(function(){ btn.disabled = false; btn.textContent = 'Send request'; var c = document.getElementById('schedConfirm'); c.textContent = 'Something went wrong. Please try again.'; c.hidden = false; });
  };
})();
</script>
</body>
</html>
