<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;padding:24px">

    { id: "avm",  lo: 345000, hi: 371000, label: "AVM estimate",     color: "#1D4FD7" }
  ]});
  zbValueSlider(document.getElementById("c"), { ranges: [
    { id: "ai",   lo: 312000, hi: 340000, label: "AI estimate",  color: "#3BA4F4" },
