<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;font:13px monospace;padding:8px">
<iframe id="f" src="../report-ranges-classic-blue.html" style="width:390px;height:600px;border:1px solid #ccc"></iframe>
<pre id="log">…</pre>
<script>
  document.getElementById("f").addEventListener("load", function () {
    var f = document.getElementById("f");
    setTimeout(function () {
      var d = f.contentDocument, out = [];
      out.push("doc scrollWidth=" + d.documentElement.scrollWidth + " clientWidth=" + d.documentElement.clientWidth);
      d.querySelectorAll("section,table,.cal-sheets,.calp,.mast,.wrap").forEach(function (el) {
        if (el.scrollWidth > el.clientWidth + 1 || el.getBoundingClientRect().right > 391) {
          var tag = el.className || el.tagName;
          out.push(String(tag).slice(0, 40) + " sw=" + el.scrollWidth + " cw=" + el.clientWidth + " right=" + Math.round(el.getBoundingClientRect().right));
        }
      });
      document.getElementById("log").textContent = out.join("\n") || "no overflow";
    }, 1200);
  });
</script>
</body></html>
