<!doctype html>
<html><body style="margin:0">
<iframe id="g" src="../design-guide.html" style="width:1100px;height:800px;border:0"></iframe>
<div id="log" style="font:16px monospace;padding:10px;background:#fff">waiting…</div>
<script>
  var g = document.getElementById("g"), log = document.getElementById("log");
  g.addEventListener("load", function () {
    setTimeout(function () {
      try {
        var d = g.contentDocument, w = g.contentWindow;
        var zf = d.querySelector('iframe[src="z-beat-tap.html"]');
        if (!zf) { log.textContent = "z-beat iframe NOT FOUND"; return; }
        zf.scrollIntoView({ block: "center" });
        var r = zf.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var el = d.elementFromPoint(cx, cy);
        log.textContent = "rect=" + Math.round(r.width) + "x" + Math.round(r.height) +
          " | elementFromPoint(center)=" + (el ? el.tagName + (el === zf ? " (THE IFRAME)" : " cls=" + el.className) : "null") +
          " | inner doc ready=" + (!!zf.contentDocument && zf.contentDocument.readyState);
      } catch (e) { log.textContent = "ERR: " + e.message; }
    }, 900);
  });
</script>
</body></html>
