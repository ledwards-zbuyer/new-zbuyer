<!doctype html>
<html><body style="margin:0;background:linear-gradient(90deg,#EDF1F7 0 35%,#C9D8EE 35% 65%,#EDF1F7 65% 100%);padding:24px;display:flex;gap:24px;justify-content:center">
<iframe id="a" src="../z-beat-tap.html?bare=1" style="width:300px;height:300px;border:0"></iframe>
<iframe id="b" src="../z-beat-tap.html" style="width:300px;height:300px;border:0"></iframe>
<script>
  // 5 taps 100ms apart: taps 2-5 each land inside the 320ms double-tap
  // window, advancing the palette 4 steps -> index 4 (Glass)
  function walk(f) {
    var n = 0, t = setInterval(function () {
      f.contentDocument.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
      if (++n >= 5) clearInterval(t);
    }, 100);
  }
  var done = 0;
  ["a", "b"].forEach(function (id) {
    var f = document.getElementById(id);
    f.addEventListener("load", function () { setTimeout(function () { walk(f); }, 400); });
  });
</script>
</body></html>
